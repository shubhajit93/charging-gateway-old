apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'groovy'
apply plugin: 'application'

sourceCompatibility = 1.8
targetCompatibility = 1.8

archivesBaseName = 'jCGW'
version = '1.5'

// Define the main class for the application
mainClassName = 'com.ssdtech.java.main.CGW'

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }

        resources {
            srcDir 'resources'
        }
    }
}

// In this section you declare where to find the dependencies of your project
allprojects {
    repositories {
        mavenCentral()
    }

    // Block EOL/vulnerable Log4j 1.x and pin Log4j2 across the whole build (incl. inrequester)
    configurations.all {
        exclude group: 'log4j', module: 'log4j'
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.apache.logging.log4j') {
                details.useVersion '2.25.5'
                details.because 'Pin Log4j2 to a version with Log4Shell and related CVEs fixed'
            }
        }
    }
}

dependencies {
    // Resource pool
    implementation 'org.apache.commons:commons-pool2:2.4.3'
    
	// Http client
	implementation 'com.squareup.okhttp3:okhttp:3.10.0'
	
	// JSON Parser
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.6'
	
	// Logger — Log4j2 (2.17.1+ required to fix Log4Shell / related CVEs; 2.25.5 is current safe)
    implementation 'org.apache.logging.log4j:log4j-api:2.25.5'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.5'
	
	// MySQL Connector
	//implementation 'mysql:mysql-connector-java:5.1.2'
	implementation 'mysql:mysql-connector-java:8.0.22'
	
	// Redis client
	implementation 'redis.clients:jedis:2.9.0'
	
	// Tomcat JDBC connection pool
	implementation 'org.apache.tomcat:tomcat-jdbc:9.0.1'
	
	// Validator
	implementation 'net.sf.oval:oval:1.87'
	
	// CGW Common Interface
	implementation project(':CGWCommonInterface')

    // Use JUnit test framework
    testImplementation 'junit:junit:4.12'
}

jar {
    manifest {
        attributes('Implementation-Title': 'jCGW',
                   'Implementation-Version': version)
    }
}

def cgwPropertyContents = '[$inRequesterHeader]\r\nIN_REQUESTER_NAME = $inRequesterName\r\nCLASS_PATH_IN_INITIALIZER = $classPathInInitializer\r\nCLASS_PATH_IN_REQUESTER = $classPathInRequester'
def template = new groovy.text.SimpleTemplateEngine().createTemplate(cgwPropertyContents)

task preprocess() {
    doFirst {
        println 'Create dist directory and copy all under ConfigurationFiles directory'
        File srcConfDir = new File('./ConfigurationFiles')
        File dstConfDir = new File('./src/dist/bin/ConfigurationFiles/')
        if (srcConfDir.exists()) {
            project.copy {
                from srcConfDir
                into dstConfDir
            }
        }

        println 'Pre-processing: modify cgw.properties file'

        def binding = []
        def contents = ''
        if (project.hasProperty('project-name') && project.getAt('project-name') == 'jcgw-with-bl-in-requester') {
            println 'For: BL IN Requester'
            binding = [
                    "inRequesterHeader":"BL IN Requester",
                    "inRequesterName":"BL IN Requester",
                    "classPathInInitializer":"com.ssdtech.Server_Threaded",
                    "classPathInRequester":"com.ssdtech.HandleRequest"
            ]
            contents = template.make(binding).toString()
        } else if (project.hasProperty('project-name') && project.getAt('project-name') == 'jcgw-with-robi-in-requester') {
            println 'For: ROBI IN Requester'
            binding = [
                    "inRequesterHeader":"ROBI IN Requester",
                    "inRequesterName":"ROBI IN Requester",
                    "classPathInInitializer":"com.ssdtech.robi.Server_Threaded",
                    "classPathInRequester":"com.ssdtech.robi.HandleRequest"
            ]
            contents = template.make(binding).toString()
        } else if (project.hasProperty('project-name') && project.getAt('project-name') == 'jcgw-with-dummy-in-requester') {
            println 'For: Dummy IN Requester'
            binding = [
                    "inRequesterHeader":"Dummy IN Requester",
                    "inRequesterName":"Dummy IN Requester",
                    "classPathInInitializer":"com.ssdtech.main.java.controller.Initializer",
                    "classPathInRequester":"com.ssdtech.main.java.controller.INRequestHandler"
            ]
            contents = template.make(binding).toString()
        } else {
            println 'For: Standalone jCGW'
        }

        File cgwProperties = new File('./resources/cgw.properties')
        cgwProperties.write(contents)

        if (project.hasProperty('project-name') && project.getAt('project-name') == 'jcgw-with-bl-in-requester') {
            println 'Adding project dependency for BL IN Requester'
            project.dependencies {
                implementation project(':BL_UCIP_Integrated')
            }

            println 'Adding configuration files for BL IN Requester'
            File srcDir = new File('../inrequester/BL_UCIP_Integrated/ConfigurationFiles/')
            File dstDir = new File('./src/dist/bin/ConfigurationFiles/')
            if (srcDir.exists()) {
                project.copy {
                    from srcDir
                    into dstDir
                }
            }

            distZip.appendix = 'with_bl_in_requester'
        } else if (project.hasProperty('project-name') && project.getAt('project-name') == 'jcgw-with-robi-in-requester') {
            println 'Adding project dependency for ROBI IN Requester'
            project.dependencies {
                implementation project(':ROBI_Integrated')
            }

            println 'Adding configuration files for ROBI IN Requester'
            File srcDir = new File('../inrequester/Robi_IN_SDP_Integrated/ConfigurationFiles/')
            File dstDir = new File('./src/dist/bin/ConfigurationFiles/')
            if (srcDir.exists()) {
                project.copy {
                    from srcDir
                    into dstDir
                }
            }

            distZip.appendix = 'with_robi_in_requester'
        } else if (project.hasProperty('project-name') && project.getAt('project-name') == 'jcgw-with-dummy-in-requester') {
            println 'Adding project dependency for Dummy IN Requester'
            project.dependencies {
                implementation project(':Dummy_IN_Integrated')
            }

            println 'Adding configuration files for Dummy IN Requester'
            File srcDir = new File('../inrequester/AIR_Dummy_Integrated/ConfigurationFiles/')
            File dstDir = new File('./src/dist/bin/ConfigurationFiles/')
            if (srcDir.exists()) {
                project.copy {
                    from srcDir
                    into dstDir
                }
            }

            distZip.appendix = 'with_dummy_in_requester'
        }
    }
}

task postprocess() {
    doFirst {
        File dstDir = new File('./src/dist/')
        dstDir.deleteDir()
    }
}

task buildcgw()  {
    dependsOn preprocess
    dependsOn build
    dependsOn postprocess

    preprocess.finalizedBy build
    postprocess.mustRunAfter build

    println 'Build jCGW with option: ' + (project.hasProperty('project-name') ? project.getAt('project-name') : '')
}