apply plugin: 'java'
apply plugin: 'eclipse'

archivesBaseName = 'in-requester-robi'
version = '1.0'
sourceCompatibility = 1.8
targetCompatibility = 1.8

sourceSets {
    main {
        java {
            srcDirs = ['src/main']
        }
    }

    test {
        java {
            srcDirs = ['src/test']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':CGWCommonInterface')
	// reload4j: drop-in replacement for EOL log4j 1.2.x with known CVEs patched
	implementation 'ch.qos.reload4j:reload4j:1.2.26'
	
	testImplementation 'org.hamcrest:hamcrest-all:1.3'
	testImplementation 'junit:junit:4.12'
	testImplementation 'pl.pragmatists:JUnitParams:1.0.4'
	testImplementation 'org.mockito:mockito-all:1.10.19'
}

jar {
    manifest {
        attributes("Implementation-Title": "ROBI IN Requester",
                   "Implementation-Version": version)
    }
}